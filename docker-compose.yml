services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wealthtwin
      POSTGRES_USER: wealthtwin
      POSTGRES_PASSWORD: wealthtwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthtwin -d wealthtwin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./wealthtwin-backend
    env_file:
      - ./wealthtwin-backend/.env.example
      - path: ./wealthtwin-backend/.env
        required: false
    environment:
      WEALTHTWIN_DATABASE_URL: postgresql+psycopg://wealthtwin:wealthtwin@postgres:5432/wealthtwin
      WEALTHTWIN_REDIS_URL: redis://redis:6379/0
      WEALTHTWIN_PUBLIC_APP_URL: http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "sh scripts/prestart.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./wealthtwin-backend
    env_file:
      - ./wealthtwin-backend/.env.example
      - path: ./wealthtwin-backend/.env
        required: false
    environment:
      WEALTHTWIN_DATABASE_URL: postgresql+psycopg://wealthtwin:wealthtwin@postgres:5432/wealthtwin
      WEALTHTWIN_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=INFO

  frontend:
    build:
      context: ./wealthtwin-frontend
      args:
        NEXT_PUBLIC_WEALTHTWIN_API_BASE: http://127.0.0.1:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
