[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthtwin-backend"
version = "0.1.0"
description = "FastAPI backend foundation for WealthTwin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "alembic>=1.13.0",
  "celery[redis]>=5.4.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
